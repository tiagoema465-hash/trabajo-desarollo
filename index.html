<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SportShop · Ropa deportiva</title>
  <link rel="stylesheet" href="css/styles.css?v=2">
  <script src="js/app.js?v=2" defer></script>
</head>
<body data-page="cliente">
  <header class="top">
    <a href="index.html">SportShop</a>
    <nav aria-label="Principal">
      <button class="btn sec" id="btnWish" aria-label="Lista de deseos" style="min-height:36px">♡<span class="badge" id="wishCount">0</span></button>
      <a href="#carrito">Carrito<span class="badge" id="cartCount">0</span></a>
      <a href="admin.php" id="lnkAdmin" hidden>Admin</a>
      <a href="login.html" id="lnkSesion">Ingresar</a>
    </nav>
  </header>

  <main>
    <h1>Equipo para tu próxima marca personal</h1>

    <!-- Búsqueda y filtrado -->
    <section aria-labelledby="t-cat" id="catalogo">
      <h2 id="t-cat">Catálogo</h2>
      <form id="filtros" class="row cols" novalidate>
        <label>Deporte
          <select name="deporte"><option value="">Todos</option><option>Fútbol</option><option>Running</option><option>Tenis</option><option>Fitness</option></select>
        </label>
        <label>Marca
          <select name="marca"><option value="">Todas</option><option>Nike</option><option>Adidas</option><option>Puma</option></select>
        </label>
        <button class="btn" type="submit">Filtrar</button>
      </form>
      <div class="grid" id="productos" aria-live="polite" style="margin-top:12px"></div>
    </section>

    <!-- Guía interactiva de tallas -->
    <section aria-labelledby="t-talla" id="tallas">
      <h2 id="t-talla">¿Cuál es tu talla?</h2>
      <form id="formTalla" novalidate>
        <label>Marca
          <select name="marca" required><option value="">Elige</option><option>Nike</option><option>Adidas</option><option>Puma</option></select>
          <span class="error"></span>
        </label>
        <div class="row cols">
          <label>Pecho (cm)<input name="pecho" type="number" inputmode="numeric" required><span class="error"></span></label>
          <label>Cintura (cm)<input name="cintura" type="number" inputmode="numeric" required><span class="error"></span></label>
          <label>Cadera (cm)<input name="cadera" type="number" inputmode="numeric" required><span class="error"></span></label>
        </div>
        <button class="btn" type="submit">Calcular talla</button>
        <p class="msg" id="resTalla" hidden></p>
      </form>
    </section>

    <!-- Carrito y checkout -->
    <section aria-labelledby="t-car" id="carrito">
      <h2 id="t-car">Carrito</h2>
      <ul class="items" id="listaCarrito"></ul>
      <p id="totalCarrito" style="text-align:right;font-weight:800;margin-top:8px"></p>
      <button class="btn sec" id="btnVaciar" type="button" style="margin-top:8px" hidden>Vaciar carrito</button>
      <form id="formPago" novalidate style="margin-top:12px">
        <label>Talla
          <select name="talla" required><option value="">Elige</option><option>S</option><option>M</option><option>L</option><option>XL</option></select><span class="error"></span>
        </label>
        <label>Método de pago
          <select name="metodo" required>
            <option value="">Elige</option><option value="tarjeta">Tarjeta</option>
            <option value="transferencia">Transferencia</option><option value="billetera_digital">Billetera digital</option>
          </select><span class="error"></span>
        </label>
        <button class="btn" type="submit">Continuar al pago</button>
        <p class="msg" id="resPago" hidden></p>
      </form>
    </section>

    <!-- Perfil: devoluciones y cambios -->
    <section aria-labelledby="t-dev" id="perfil">
      <h2 id="t-dev">Cambios y devoluciones</h2>
      <form id="formDev" novalidate>
        <label>N.º de pedido<input name="pedido_id" inputmode="numeric" required><span class="error"></span></label>
        <label>¿Qué necesitas?
          <select name="tipo" required>
            <option value="">Elige</option><option value="cambio_talla">Cambiar talla</option>
            <option value="cambio_prenda">Cambiar prenda</option><option value="reembolso">Reembolso</option>
          </select><span class="error"></span>
        </label>
        <label id="lblNueva" hidden>Talla nueva
          <select name="talla_nueva"><option value="">Elige</option><option>S</option><option>M</option><option>L</option><option>XL</option></select><span class="error"></span>
        </label>
        <label>Motivo<textarea name="motivo" rows="3" required></textarea><span class="error"></span></label>
        <button class="btn" type="submit">Enviar solicitud</button>
        <p class="msg" id="resDev" hidden></p>
      </form>
    </section>
  </main>

  <nav class="bar" aria-label="Acceso rápido">
    <a href="#catalogo">Catálogo</a><a href="#tallas">Tallas</a><a href="#carrito">Carrito</a><a href="#perfil">Perfil</a>
  </nav>
</body>
</html>
