<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · SportShop</title>
  <link rel="stylesheet" href="css/styles.css?v=2">
  <script src="js/app.js?v=2" defer></script>
</head>
<body data-page="login">
  <header class="top"><a href="index.html">SportShop</a><a href="index.html">Volver a la tienda</a></header>
  <main class="split">
    <section aria-labelledby="t-in">
      <h2 id="t-in">Ingresar</h2>
      <form id="formLogin" novalidate>
        <label>Correo<input name="email" type="email" autocomplete="username" required><span class="error"></span></label>
        <label>Contraseña<input name="clave" type="password" autocomplete="current-password" required><span class="error"></span></label>
        <button class="btn" type="submit">Ingresar</button>
        <p class="msg" id="resLogin" hidden></p>
      </form>
    </section>
    <section aria-labelledby="t-reg">
      <h2 id="t-reg">Crear cuenta de cliente</h2>
      <form id="formRegistro" novalidate>
        <label>Nombre<input name="nombre" autocomplete="name" required maxlength="80"><span class="error"></span></label>
        <label>Correo<input name="email" type="email" autocomplete="email" required><span class="error"></span></label>
        <label>Contraseña<input name="clave" type="password" autocomplete="new-password" required><span class="error"></span></label>
        <button class="btn" type="submit">Crear cuenta</button>
        <p class="msg" id="resReg" hidden></p>
      </form>
    </section>
  </main>
</body>
</html>
